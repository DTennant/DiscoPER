# Hard Benchmark Configuration
# - Many patterns, including subtle effects
# - 3 prior knowledge, 3 obvious, 13 novel patterns
# - Novel patterns: 2 simple, 3 moderate, 8 complex

benchmark:
  name: ecology_hard
  seed: 42
  n_samples: 10000
  n_species: 50
  n_regions: 5
  
  # ===== TIER 1: PRIOR KNOWLEDGE (agent already knows these) =====
  prior_knowledge:
    - id: prior_temp_elev
      type: correlation
      variables: [temperature, elevation]
      effect: -0.85
      description: "Temperature decreases with elevation (lapse rate)"
    
    - id: prior_lat_temp
      type: correlation
      variables: [latitude, temperature]
      effect: -0.70
      description: "Higher latitudes are colder"
    
    - id: prior_precip_veg
      type: correlation
      variables: [precipitation, vegetation_density]
      effect: 0.65
      description: "More rain leads to denser vegetation"
      
  # ===== TIER 2: OBVIOUS PATTERNS (easy to find, not novel) =====
  obvious_patterns:
    - id: obvious_bergmann
      type: correlation
      variables: [body_size, temperature]
      effect: -0.55
      description: "Bergmann's rule - larger body size in colder climates"
    
    - id: obvious_habitat_richness
      type: group_difference
      variable: species_richness
      group_by: habitat_type
      effect: 0.6
      description: "Forest habitats have higher species richness"
    
    - id: obvious_elevation_treeline
      type: threshold
      variables: [tree_presence, elevation]
      threshold: 2500
      effect_below: 0.7
      effect_above: 0.1
      description: "Trees become rare above treeline elevation"
      
  # ===== TIER 3: NOVEL PATTERNS (should be discovered) =====
  novel_patterns:
    # ===========================================================
    # SIMPLE NOVEL (1-2 features, conditional)
    # ===========================================================
    - id: novel_threshold_migration
      type: threshold
      variables: [wing_length, migration_distance]
      condition_var: body_mass
      threshold: 50
      effect_below: 0.1
      effect_above: 0.6
      difficulty: simple
      description: "Wing length predicts migration only for birds > 50g"
      discovery_hints:
        - "Look at bird data separately"
        - "Body mass may be a moderator"
    
    - id: novel_simpson_foraging
      type: simpson_paradox
      variables: [foraging_height, prey_size]
      group_by: species_family
      overall_effect: 0.3
      within_effect: -0.4
      difficulty: simple
      description: "Foraging height and prey size: positive overall, negative within families"
      discovery_hints:
        - "Overall correlation may be misleading"
        - "Stratify by taxonomic group"

    # ===========================================================
    # MODERATE NOVEL (2-3 features, interactions)
    # ===========================================================
    - id: novel_elevation_wet
      type: two_way_interaction
      outcome: abundance
      predictors: [elevation, precipitation]
      main_effects: [0.2, 0.1]
      interaction_effect: 0.5
      difficulty: moderate
      description: "Species prefer high elevation only when wet"
      discovery_hints:
        - "Test interaction between elevation and precipitation"
        - "Effect is conditional on climate"
    
    - id: novel_observer_confound
      type: conditional_confound
      apparent_correlation: [observer_experience, species_count]
      confound: sampling_in_hotspot
      apparent_effect: 0.5
      true_effect: 0.05
      difficulty: moderate
      description: "Experienced observers find more species (spurious - they sample better locations)"
      discovery_hints:
        - "This correlation may be spurious"
        - "Check for confounding by sampling location"
    
    - id: novel_masked_diet
      type: masked_correlation
      variables: [diet_diversity, range_size]
      confounder: body_size
      marginal_effect: 0.05
      partial_effect: 0.45
      difficulty: moderate
      description: "Diet-range correlation hidden by body size"
      discovery_hints:
        - "Marginal correlation appears weak"
        - "Control for body size to reveal true relationship"

    # ===========================================================
    # COMPLEX NOVEL (3+ features, chains, hierarchies)
    # ===========================================================
    - id: novel_threeway_nocturnal
      type: three_way_interaction
      outcome: elevation_preference
      predictors: [precipitation, canopy_cover, is_nocturnal]
      effects:
        main: [0.1, 0.1, 0.0]
        two_way:
          x1_x2: 0.2
          x1_x3: 0.1
          x2_x3: 0.15
        three_way: 0.4
      difficulty: complex
      description: "Nocturnal species' elevation preference depends on precipitation AND canopy"
      discovery_hints:
        - "Stratify by is_nocturnal"
        - "Look for interaction between precipitation and canopy_cover"
        - "Effect strongest in nocturnal subset"
    
    - id: novel_mediation_chain
      type: mediation_chain
      chain: [temperature, vegetation_density, insect_abundance, bird_richness]
      direct_effects: [0.7, 0.6, 0.5]
      difficulty: complex
      description: "Temperature affects bird richness through vegetation and insects"
      discovery_hints:
        - "Direct climate-bird correlation is weak"
        - "Partial correlations reveal mediation"
        - "Sequential regression shows chain"
    
    - id: novel_hierarchical_bergmann
      type: hierarchical_effect
      variables: [temperature, body_size]
      hierarchy_col: taxonomic_class
      effects_by_level:
        Mammalia: -0.5
        Reptilia: 0.4
        Aves: -0.3
      difficulty: complex
      description: "Bergmann's rule reverses for reptiles"
      discovery_hints:
        - "Effect may differ by taxonomic class"
        - "Reptiles may show opposite pattern"
    
    - id: novel_latent_habitat
      type: latent_variable
      observed_vars: [prey_density, vegetation_density, water_proximity]
      correlations_induced:
        - [1, 0.6, 0.5]
        - [0.6, 1, 0.55]
        - [0.5, 0.55, 1]
      latent_name: "habitat_quality"
      difficulty: complex
      description: "These variables correlate due to hidden habitat quality factor"
      discovery_hints:
        - "PCA would reveal single latent factor"
        - "Correlations are not causal between observed vars"
        - "Factor analysis reveals hidden structure"
    
    - id: novel_uShape_diversity
      type: nonlinear_piecewise
      variables: [temperature, species_diversity]
      breakpoints: [10, 25]
      slopes: [-0.3, 0.05, -0.25]
      difficulty: complex
      description: "Diversity drops at temperature extremes, stable in middle"
      discovery_hints:
        - "Relationship may be non-linear"
        - "Check for threshold effects"
        - "U-shaped or inverted-U pattern"
    
    - id: novel_seasonal_flip
      type: temporal_interaction
      variables: [temperature, elevation_use]
      time_col: season
      effects:
        winter: -0.5
        spring: 0.1
        summer: 0.5
        fall: 0.0
      difficulty: complex
      description: "Temperature-elevation relationship varies by season"
      discovery_hints:
        - "Stratify by season"
        - "Effect direction may flip"
        - "Consider temporal variation"
    
    - id: novel_spatial_cooccur
      type: spatial_cluster
      variables: [species_A_presence, species_B_presence, species_C_presence]
      region_col: biogeographic_region
      cluster_pattern:
        region_0: [1, 1, 0]  # A and B co-occur
        region_1: [0, 1, 1]  # B and C co-occur
        region_2: [1, 0, 1]  # A and C co-occur
        region_3: [1, 1, 1]  # All three co-occur
        region_4: [0, 0, 1]  # Only C present
      difficulty: complex
      description: "Species co-occurrence varies by biogeographic region"
      discovery_hints:
        - "Stratify by biogeographic region"
        - "Co-occurrence patterns are region-specific"
        - "Some species pairs only co-occur in certain regions"
    
    - id: novel_competition_keystone
      type: competition_masking
      competing_species: [species_X_abundance, species_Y_abundance]
      keystone: keystone_species_present
      effect_without_keystone: -0.6
      effect_with_keystone: 0.1
      difficulty: complex
      description: "Species X and Y compete unless keystone species is present"
      discovery_hints:
        - "Negative correlation may be context-dependent"
        - "Third species presence may moderate relationship"
        - "Competition may be masked in some conditions"

  include_prior_in_prompt: true
  prior_prompt_detail: full
