.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.bar-label{font-size:11px;color:#64748b;width:32px;text-align:right}
.bar-track{flex:1;height:14px;background:#f1f5f9;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;min-width:2px}
.bar-val{font-size:11px;color:#475569;width:50px}
.images{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
.img-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.images img{width:120px;height:90px;object-fit:cover;border-radius:4px;border:1px solid #e2e8f0}
.img-cap{font-size:10px;color:#64748b;margin-top:2px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
.gt-box{background:#eff6ff;border-radius:4px;padding:8px 12px;font-size:12px;color:#1e40af;margin-bottom:10px}

.variables{font-size:12px;color:#64748b;margin-bottom:8px}

details.code-block{margin:8px 0}
details.code-block summary{cursor:pointer;color:#6366f1;font-size:13px;font-weight:500}
details.code-block summary:hover{text-decoration:underline}
details.code-block pre{background:#1e293b;color:#e2e8f0;border-radius:6px;padding:12px;margin:6px 0 0;overflow-x:auto;font-size:12px;line-height:1.5}

function esc(s){if(!s)return"";var d=document.createElement("div");d.appendChild(document.createTextNode(s));return d.innerHTML}
function fpv(p){return p<0.001?"<0.001":p.toFixed(4)}
function render(){
  var key=document.getElementById("ds").value;
  var ds=DATASETS[key];if(!ds)return;
  var insights=ds.data.insights||[];
  var fv=document.getElementById("fv").value;
  var fs=document.getElementById("fs").value;
  var filtered=insights.filter(function(i){
    if(fv==="all")return true;
    return i.verdict===fv;
  });
  filtered.sort(function(a,b){
    if(fs==="effect")return(Math.abs(b.effect_size||0))-(Math.abs(a.effect_size||0));
    if(fs==="pval")return(a.p_value==null?1:a.p_value)-(b.p_value==null?1:b.p_value);
    return(a.iteration||0)-(b.iteration||0);
  });
  document.getElementById("countInfo").textContent=ds.label+" — showing "+filtered.length+" of "+insights.length+" insights";
  var h="";
  for(var i=0;i<filtered.length;i++){
    var ins=filtered[i];
    var vc=ins.verdict==="rejected"?" rejected":ins.verdict==="inconclusive"?" inconclusive":"";
    h+='<div class="card'+vc+'">';
    // badges
    h+='<div class="badges">';
    var bc=ins.verdict==="supported"?"badge-supported":ins.verdict==="rejected"?"badge-rejected":"badge-inconclusive";
    h+='<span class="badge '+bc+'">'+esc(ins.verdict)+'</span>';
    if(ins.is_meta)h+='<span class="badge badge-meta">REFLECT</span>';
    if(ins.vision_informed)h+='<span class="badge badge-vision">VISION</span>';
    if(ins.gt_match)h+='<span class="badge badge-gt">GT MATCH</span>';
    h+='<span class="badge" style="background:#f1f5f9;color:#475569">Iter '+ins.iteration+'</span>';
    h+='</div>';
    // claim
    h+='<div class="card-claim">'+esc(ins.claim||"")+'</div>';
    // metrics
    var es=ins.effect_size!=null?ins.effect_size.toFixed(3):"--";
    var pv=ins.p_value!=null?fpv(ins.p_value):"--";
    var ves=ins.val_effect_size!=null?ins.val_effect_size.toFixed(3):"--";
    var vpv=ins.val_p_value!=null?fpv(ins.val_p_value):"--";
    h+='<div class="metrics">';
    h+='<span><span class="label">Effect: </span>'+es+'</span>';
    h+='<span><span class="label">P: </span>'+pv+'</span>';
    h+='<span><span class="label">Val Effect: </span>'+ves+'</span>';
    h+='<span><span class="label">Val P: </span>'+vpv+'</span>';
    h+='<span><span class="label">Method: </span>'+esc(ins.method||"--")+'</span>';
    h+='</div>';
    // effect bars
    if(ins.effect_size!=null){
      var te=Math.abs(ins.effect_size);
      var ve=ins.val_effect_size!=null?Math.abs(ins.val_effect_size):null;
      var mx=Math.max(te,ve||0,0.5);
      var tp=Math.min(100,(te/mx)*100);
      var tc=te>=0.5?"#2d7d46":te>=0.2?"#e8a838":"#c0392b";
      h+='<div class="effect-bars">';
      h+='<div class="bar-row"><span class="bar-label">Train</span><div class="bar-track"><div class="bar-fill" style="width:'+tp.toFixed(1)+'%;background:'+tc+'"></div></div><span class="bar-val">'+te.toFixed(3)+'</span></div>';
      if(ve!=null){
        var vp=Math.min(100,(ve/mx)*100);
        var vcc=ve>=0.5?"#2d7d46":ve>=0.2?"#e8a838":"#c0392b";
        h+='<div class="bar-row"><span class="bar-label">Val</span><div class="bar-track"><div class="bar-fill" style="width:'+vp.toFixed(1)+'%;background:'+vcc+'"></div></div><span class="bar-val">'+ve.toFixed(3)+'</span></div>';
      }
      h+='</div>';
    }
    // images
    if(ins.image_urls&&ins.image_urls.length>0){
      var lbls=ins.image_labels||[];
      h+='<div class="images">';
      for(var j=0;j<ins.image_urls.length;j++){
        h+='<div class="img-wrap"><img src="'+esc(ins.image_urls[j])+'" loading="lazy" onerror="this.parentElement.style.display=\'none\'"><span class="img-cap">'+esc(lbls[j]||"")+'</span></div>';
      }
      h+='</div>';
    }
    // variables
    if(ins.variables&&ins.variables.length){
      h+='<div class="variables">Variables: ';
      for(var v=0;v<ins.variables.length;v++)h+='<code>'+esc(ins.variables[v])+'</code> ';
      h+='</div>';
    }
    // GT match
    if(ins.gt_match){
      var gt=ins.gt_match;
      h+='<div class="gt-box">Ground Truth: '+esc(gt.gt_description||gt.gt_pattern_id||"");
      if(gt.gt_tier)h+=' | Tier: '+esc(gt.gt_tier);
      if(gt.match_score!=null)h+=' | Score: '+gt.match_score.toFixed(2);
      if(gt.literature){
        if(gt.literature_url)h+='<br><a href="'+esc(gt.literature_url)+'" target="_blank">'+esc(gt.literature)+'</a>';
        else h+='<br><span style="color:#6366f1">'+esc(gt.literature)+'</span>';
      }
      h+='</div>';
    }
    // code
    if(ins.code){
      h+='<details class="code-block"><summary>View Experiment Code</summary><pre><code>'+esc(ins.code)+'</code></pre></details>';
    }
    h+='</div>';
  }
  document.getElementById("list").innerHTML=h||'<div style="text-align:center;padding:40px;color:#94a3b8">No insights match the current filter.</div>';
}
document.getElementById("ds").addEventListener("change",render);
document.getElementById("fv").addEventListener("change",render);
document.getElementById("fs").addEventListener("change",render);
render();
</script>
